<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/personal-portfolio/css/style.css" />
    <title>Contact</title>
</head>

<body>
    <div id="header"></div>
    <section class="contact section" id="contact">

        <div class="container contact-wrapper fade-up">

            <p class="section-tag">
                CONTACT
            </p>

            <h2 class="section-title">
                Let's Build Something Great
            </h2>

            <form class="contact-form">

                <input type="text" placeholder="Your Name" />
                <input type="email" placeholder="Your Email" />
                <textarea placeholder="Your Message"></textarea>

                <button type="submit" class="btn primary-btn">
                    Send Message
                </button>

            </form>

            <div class="social-links">
                <a href="https://www.instagram.com/tdm15_02/">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">Tiktok</a>

            </div>

        </div>

    </section>
    <div id="footer"></div>
    <!-- JS -->
    <script src="/personal-portfolio/js/script.js"></script>
</body>

</html>
