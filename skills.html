<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/personal-portfolio/css/style.css" />
    <title>Skills</title>
</head>

<body>
    <div id="header"></div>
    <section class="skills section" id="skills">
        <div class="container">

            <div class="section-header fade-up">

                <p class="section-tag">
                    SKILLS
                </p>

                <h2 class="section-title">
                    Technologies
                </h2>

            </div>

            <div class="skills-wrapper">

                <div class="skill fade-up">

                    <div class="skill-top">
                        <span>HTML</span>
                        <span>95%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress html"></div>
                    </div>

                </div>

                <div class="skill fade-up">

                    <div class="skill-top">
                        <span>CSS</span>
                        <span>90%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress css"></div>
                    </div>

                </div>

                <div class="skill fade-up">

                    <div class="skill-top">
                        <span>JavaScript</span>
                        <span>85%</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress js"></div>
                    </div>

                </div>

            </div>

        </div>

    </section>
    <div id="footer"></div>

    <!-- JS -->
    <script src="/personal-portfolio/js/script.js"></script>
</body>

</html>
